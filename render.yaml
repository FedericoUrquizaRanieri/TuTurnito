services:
  - type: web
    name: tuturnito-api
    runtime: node
    plan: free
    # prisma and typescript are devDependencies, hence --include=dev.
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build --workspace=server && npx prisma migrate deploy --schema server/prisma/schema.prisma
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
