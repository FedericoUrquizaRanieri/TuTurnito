# Pings the API so Render's free instance doesn't fall asleep (it sleeps after
# 15 min idle) and so the health check's DB query counts as activity for
# Supabase (free projects pause after a week without it).
# Needs the repo secret API_URL, e.g. https://tuturnito-api.onrender.com
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 --retry 2 --retry-delay 10 "${{ secrets.API_URL }}/api/health"
